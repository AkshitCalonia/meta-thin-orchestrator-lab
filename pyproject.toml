[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "meta-thin-orchestrator-lab"
version = "0.1.0"
description = "Reproducible study of deterministic orchestration and specialized workflow workers"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["thin_orchestrator*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
